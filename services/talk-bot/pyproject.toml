[project]
name = "whiteboardai-talk-bot"
version = "1.0.0"
description = "Nextcloud Talk join-bot: transcribe calls and upload DOCX summaries"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "playwright>=1.49.0",
  "python-docx>=1.1.2",
]

[project.scripts]
whiteboardai-talk-bot = "talk_bot.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["talk_bot*"]
